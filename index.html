<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idam Jagath – The Invasion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="objective"></div>
      <div id="crosshair"></div>
      <div id="hitmarker"></div>
      <div id="toast"></div>
      <div id="health"><span class="label">HEALTH</span><span id="health-val">100</span></div>
      <div id="ammo">
        <div id="weapons"></div>
        <span id="ammo-val">30</span><span class="label"> / ∞</span>
      </div>
      <div id="waypoint"><div class="diamond"></div><div id="waypoint-dist"></div></div>
      <div id="damage"></div>
      <div id="reload-ring"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="track" cx="20" cy="20" r="16" /><circle id="reload-ring-fill" cx="20" cy="20" r="16" /></svg></div>
      <div id="ammo-warn">LOW AMMO · R</div>
    </div>

    <div id="overlay">
      <div id="menu-bg"></div>
      <div id="menu-shade"></div>
      <div id="menu-root"></div>
      <div id="build-tag"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
